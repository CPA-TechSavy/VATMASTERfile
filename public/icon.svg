<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="accent-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" stroke="#334155" stroke-width="4" fill="none"/>

  <!-- Inner Badge / Shield -->
  <g filter="url(#shadow)">
    <!-- BIR Header Card -->
    <rect x="96" y="88" width="320" height="336" rx="28" fill="#ffffff"/>
    <!-- Top banner -->
    <path d="M 96 116 C 96 100.5 108.5 88 124 88 L 388 88 C 403.5 88 416 100.5 416 116 L 416 160 L 96 160 Z" fill="url(#gold-grad)"/>
    
    <!-- Title Text BIR -->
    <text x="256" y="138" text-anchor="middle" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" letter-spacing="3">BIR TAX</text>
    
    <!-- Subtitle Bar -->
    <rect x="132" y="184" width="248" height="24" rx="6" fill="#f1f5f9"/>
    <text x="256" y="201" text-anchor="middle" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="14" letter-spacing="1">RETURNS CALCULATOR</text>

    <!-- Tax Analytics Chart Bars -->
    <!-- Bar 1 (Emerald - Sales) -->
    <rect x="140" y="290" width="48" height="96" rx="8" fill="#10b981"/>
    <!-- Bar 2 (Blue - Deductions) -->
    <rect x="206" y="248" width="48" height="138" rx="8" fill="url(#accent-blue)"/>
    <!-- Bar 3 (Amber - Tax Due) -->
    <rect x="272" y="272" width="48" height="114" rx="8" fill="#f59e0b"/>
    <!-- Bar 4 (Purple - Credits) -->
    <rect x="338" y="320" width="48" height="66" rx="8" fill="#8b5cf6"/>

    <!-- Baseline -->
    <rect x="124" y="392" width="264" height="6" rx="3" fill="#cbd5e1"/>

    <!-- Calculator Mini Display -->
    <circle cx="152" cy="242" r="8" fill="#0ea5e9"/>
    <circle cx="180" cy="242" r="8" fill="#10b981"/>
    <line x1="220" y1="242" x2="356" y2="242" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
